services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: examdb
      POSTGRES_USER: examuser
      POSTGRES_PASSWORD: exampass
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  # نکته: MinIO ایمیج‌هاش رو از Docker Hub برداشته، باید از quay.io گرفته بشه
  # ذخیره‌ی فایل‌های آپلودی (ویدیو/پیوست درس) - مقادیر با server/.env هماهنگه
  minio:
    image: quay.io/minio/minio:RELEASE.2024-04-18T19-09-19Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  # سرور خودش bucket نمی‌سازه، این سرویس یک‌بار bucket رو می‌سازه و تموم می‌شه
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-04-18T16-45-29Z
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/exam-platform-uploads;
      exit 0;
      "

volumes:
  postgres-data:
  redis-data:
  minio-data:
