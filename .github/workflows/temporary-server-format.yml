name: Temporary server formatting repair

on:
  push:
    branches:
      - chore/client-format-and-auth-validation

permissions:
  contents: write

jobs:
  format-server:
    if: github.event.head_commit.message != 'chore: temporary formatter repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/client-format-and-auth-validation
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format -w server
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add server
            git commit -m "chore: temporary formatter repair"
            git push origin HEAD:chore/client-format-and-auth-validation
          fi
