<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سامانه آزمون آنلاین</title>
    <!--
      قبل از هر چیزی (حتی قبل از لودِ فونت/CSS) اجرا می‌شه تا کلاسِ dark رو
      سینک با localStorage ست کنه - اگه این نبود، کاربری که تمِ تاریک انتخاب
      کرده هر بار رفرش/باز کردنِ صفحه یه لحظه تمِ روشن رو می‌دید و بعد
      می‌پرید به تاریک (چون useTheme.ts کلاس رو فقط تو useEffect ست می‌کنه،
      یعنی بعد از mount شدنِ React و اولین paint)
    -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
