name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U examuser -d examdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # نبودِ Postgres/Redis تو CI باید تست رو fail کنه، نه skip (server/tests/helpers/serviceGuard.ts)
      REQUIRE_SERVICES: '1'
      DATABASE_URL: postgresql://examuser:exampass@localhost:5432/examdb
      REDIS_URL: redis://localhost:6379
      # این‌ها فقط برای CI هستن (نه secret واقعی) - چون envSchema حداقل طول
      # ۳۲ کاراکتر برای این دو تا می‌خواد، و بدون مقدار سرور اصلاً بالا نمیاد
      JWT_ACCESS_SECRET: ci-only-dummy-access-secret-not-real-1234567890
      JWT_REFRESH_SECRET: ci-only-dummy-refresh-secret-not-real-1234567890
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: node scripts/prepare-vendor.cjs && npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Test backup and alert failure handling
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py'

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Verify migrated schema matches Prisma model
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
        working-directory: server

      - name: Lint and check server formatting
        run: npm run lint -w server && npm run format:check -w server

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Check initial client transfer budget
        run: node scripts/check-client-budget.cjs

      - name: Lint client
        run: npm run lint -w client

      - name: Run client tests
        run: npm test -w client

      - name: Install browser for UI checks
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: Run browser and accessibility checks
        run: npm run test:e2e -w client

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: client/test-results/
          if-no-files-found: ignore

      - name: Install video inspection tools
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            ffprobe -version | head -n 1
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Run server tests
        if: ${{ success() }}
        run: npm test -w server

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: |
          docker build --tag online-exam-api:ci .
          docker run --rm --read-only --tmpfs /tmp online-exam-api:ci node -e "const fs=require('fs'); if(process.getuid()===0 || fs.existsSync('/app/server/src') || fs.existsSync('/app/server/.env') || fs.existsSync('/app/vendor')) process.exit(1); require('@prisma/client'); console.log('Non-root minimal runtime verified')"
          docker run --rm --tmpfs /tmp online-exam-api:ci npx --no-install prisma --version

  local-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate local credentials and validate Compose
        run: |
          node scripts/setup-local.cjs
          docker compose config --quiet
      - name: Start fresh local services
        run: |
          docker compose up -d postgres redis minio
          for attempt in $(seq 1 60); do
            if docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' && docker compose exec -T redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG; then break; fi
            sleep 2
          done
          docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          docker compose exec -T redis sh -c 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG
          docker compose exec -T redis redis-cli ping | grep -q NOAUTH
          docker compose run --rm minio-init
      - name: Clean isolated smoke environment
        if: always()
        run: docker compose down --volumes

  production-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Build production application images
        run: |
          docker build -t online-exam-api:ci .
          docker build -f deploy/Web.Dockerfile -t online-exam-web:ci .
      - name: Verify TLS proxy and encrypted database restore
        run: bash deploy/tests/smoke.sh
