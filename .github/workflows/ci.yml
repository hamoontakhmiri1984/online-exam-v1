name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: examdb
          POSTGRES_USER: examuser
          POSTGRES_PASSWORD: exampass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://examuser:exampass@localhost:5432/examdb
      REDIS_URL: redis://localhost:6379
      # این‌ها فقط برای CI هستن (نه secret واقعی) - چون envSchema حداقل طول
      # ۳۲ کاراکتر برای این دو تا می‌خواد، و بدون مقدار سرور اصلاً بالا نمیاد
      JWT_ACCESS_SECRET: ci-only-dummy-access-secret-not-real-1234567890
      JWT_REFRESH_SECRET: ci-only-dummy-refresh-secret-not-real-1234567890
      GOOGLE_CLIENT_ID: ci-placeholder-google-client-id

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: server

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: server

      - name: Build server
        run: npm run build -w server

      - name: Build client
        run: npm run build -w client

      - name: Lint client
        run: npm run lint -w client

      - name: Run server tests
        run: npm test -w server